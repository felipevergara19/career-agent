services:
  postgres:
    image: postgres:16-alpine
    container_name: career-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-career}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-career_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-career_agent}
    ports:
      - "5432:5432"
    volumes:
      - career_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-career} -d ${POSTGRES_DB:-career_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: career-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/career_neo4j_pass}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"   # Neo4j Browser (visualizador de grafos)
      - "7687:7687"   # Bolt protocol (usado por GraphRAG)
    volumes:
      - career_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  career-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: career-app
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOME: /tmp
      DATABASE_URL: postgresql://${POSTGRES_USER:-career}:${POSTGRES_PASSWORD:-career_secret_pass}@postgres:5432/${POSTGRES_DB:-career_agent}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/career_neo4j_pass}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    ports:
      - "8000:8000"   # Dashboard Web + API FastAPI
    volumes:
      # Bind mounts locales: tus archivos, ofertas y PDFs viven en tu repo/host
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./.agents:/app/.agents
      - ./agentes.yaml:/app/agentes.yaml
      - ./perfil:/app/perfil
      - ./ofertas:/app/ofertas
      - ./cvs-generados:/app/cvs-generados
      - ./postulaciones:/app/postulaciones
      - ./entrevistas:/app/entrevistas
      - ./logs:/app/logs
      - ./.locks:/app/.locks
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  career_pgdata:
  career_neo4j_data:
